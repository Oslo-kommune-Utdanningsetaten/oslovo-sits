site_name: Rutiner for SITS

nav:
  - Lærer:
      - Index: laerer/index.md
      - Testdokument: laerer/testdokument.md

  - Administrasjon:
      - Index: admin/index.md

      - Felles:
          - felles_1: admin/felles/felles_1.md
          - felles_2: admin/felles/felles_2.md

      - Norsk:
          - norsk_1: admin/norsk/norsk_1.md
          - norsk_2: admin/norsk/norsk_2.md

      - ITO:
          - ITO_1: admin/ito/ito_1.md
          - ITO_1: admin/ito/ito_1.md

      - FOV:
          - FOV_1: admin/fov/fov_1.md
          - FOV_2: admin/fov/fov_2.md

      - Servicesenter:
          - Servicesenter_1: admin/sese/sese_1.md
          - Servicesenter_2: admin/sese/sese_2.md

theme:
    language: nb 
    name: material
    logo: assets/images/logo.png
    features:
        - navigation.tabs
        - navigation.indexes
    palette:
      primary: teal
    icon:
      annotation: material/image-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - abbr
  - attr_list
  - pymdownx.snippets
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
      
  
extra:
  generator: false

extra_css:
  - stylesheets/extra.css

  
  
plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: false
  - glightbox