site_name: Rutiner for SITS

nav:
    - For lærere:
        - Index: laerer/index.md

        - For alle lærere:
            - Innlogging i eVision: laerer/l01.md
            - Timeplaner: laerer/l02.md
            - Personsøk: laerer/l03.md
            - Klasselister: laerer/l04.md
            - Fraværsføring: laerer/l05.md
            - Sluttføring: laerer/l06.md
            - Opplasting deltakerdok.: laerer/l08.md
            - Endring av norskplan: laerer/l09.md
            - Utvidet norskopplæring: laerer/l10.md
            - Påmelding norskprøver: laerer/l11.md
            - Oppdatering av nivå for ny kursperiode: laerer/l12.md
            - IP, IUP og samtalelogg: laerer/l13.md
            - Lesekartlegging: laerer/l15.md
            - Rask. Veileder for å merke deltaker som rask: laerer/l17.md

        - For lærere i FOV:
            - Vedtak om særskilt språkopplæring: laerer/l16.md
            - Generere varselbrev om fare for ikke vurdering i fag: laerer/l14.md

        - For lærere i ITO:
            - Deltakertimer SU: laerer/l07.md

    - Felles for administrasjon:
        - Index: felles/index.md
        - Bytte klasse på en deltaker: felles/bytte_klasse.md
        - Få oversikt over deltaker: felles/deltaker_oversikt.md
        - Bytte klasse på en deltaker: felles/bytte_klasse.md
        - Melde deltakere på og av et kurs: felles/påmelde_deltaker.md
        - Endre start- og sluttdato og kursstatus for en hendelseskode på en gitt deltaker: felles/endre_start_slutt.md
        - Fikse datakvalitet: felles/datakvalitet.md
        - Lage og slette kurs: felles/lage_kurs.md
        - Endre rettigheter på en deltaker: felles/endre_rett.md
        - Endre på kurs: felles/endre_kurs.md
        - Oversikt over rapporter: felles/rapporter.md
        - Behandle skjermede personer: felles/skjermet_person.md
        - Skrive ut timeplaner: felles/generere_timeplan.md
        - Rapport for skyssrefusjon: felles/skyss.md

    - Norsk:
        - Index: norsk/index.md

        
    - Tilrettelagt opplæring:
        - Index: ito/index.md


    - FOV:
        - Index: fov/index.md



    - Andre tilbud:
        - Utdanningsløftet: andre_tilbud/utdanningsløftet.md

    - Servicesenter:
        - Index: sese/index.md


    - Superbrukere:
        - Index: superbruker/index.md

theme:
    language: nb 
    name: material
    logo: assets/images/logo.png
    features:
        - navigation.tabs
        - navigation.indexes
        - content.annotations
    palette:
      primary: teal
    icon:
      annotation: material/chevron-right-circle

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - abbr
  - attr_list
  - pymdownx.snippets:
        auto_append:
            - includes/abbreviations.md
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - md_in_html
      
  
extra:
  generator: false

extra_css:
  - stylesheets/extra.css

  
  
plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: false
  - glightbox