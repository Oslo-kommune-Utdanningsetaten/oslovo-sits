site_name: Rutiner for SITS

nav:
    - For lærere:
        - Index: laerer/index.md
        - For alle lærere:
            - Administrere egen konto: laerer/admin_konto.md
            - Se og rediger personopplysninger: laerer/rediger_deltakerinformasjon.md
            - Finn timeplaner: laerer/timeplan.md
            - Se og rediger klasselister: laerer/klasselister.md
            - Føre fravær: laerer/fravær.md
            - Sluttføre deltaker: laerer/sluttføring.md
            - Registrere deltaker til norskprøven: laerer/reg_norskprøve.md
            - Oppdatere norsknivå: laerer/oppdater_nivå.md
            - Registrere lesekartlegging: laerer/reg_lesekartlegging.md
            - Se og rediger deltakerinformasjon : laerer/rediger_deltakerinformasjon.md

        - Bare for lærere i FOV:
            - Vedtak om særskilt språkopplæring: laerer/s_sp.md
            - Generere varselbrev om IV: laerer/varsel_iv.md
            - Behandle IUP: laerer/behandle_iup.md

        - Bare for lærere i ITO:
            - Registrering av ikke-timeplanlagt undervisning : laerer/ikke_timeplanlagt.md
            - Bekrefte deltakelse: laerer/bekreft_deltakelse.md
            - Føre samtalelogg: laerer/samtalelogg.md

    - Felles for administrasjon:
        - Bruk av SITS Live:
            - Index: felles/index.md
        - Deltakerbehandling:
            - Nytt individ: felles/ny_person.md
            - Ny deltaker: felles/ny_deltaker.md
            - Bytte klasse på en deltaker: felles/bytte_klasse.md
            - Få oversikt over deltaker: felles/deltaker_oversikt.md
            - Endre rettigheter på en deltaker: felles/endre_rett.md
            - Behandle skjermede personer: felles/skjermet_person.md
            - Melde deltakere på og av et kurs: felles/påmelde_deltaker.md
            - Endre start- og sluttdato og kursstatus for en hendelseskode på en gitt deltaker: felles/endre_start_slutt.md
            - Føre fravær: føre_fravær.md
        - Oversikt og kontroll:
            - Fikse datakvalitet: felles/datakvalitet.md
            - Endre fødselsnummer på deltaker: felles/fnr.md
            - Rapport for skyssrefusjon: felles/skyss.md
            - Oversikt over rapporter: felles/rapporter.md
            - Skrive ut timeplaner: felles/generere_timeplan.md
        - Kursbehandling:
            - Lage og slette kurs: felles/lage_kurs.md
            - Endre på kurs: felles/endre_kurs.md

    - Norsk:
        - Index: norsk/index.md

        
    - Tilrettelagt opplæring:
        - Index: ito/index.md


    - FOV:
        - Index: fov/index.md



    - Andre tilbud:
        - Utdanningsløftet: andre_tilbud/utdanningsløftet.md

    - Servicesenter:
        - Index: sese/index.md


    - Superbrukere:
        - Index: superbruker/index.md

theme:
    language: nb 
    name: material
    logo: assets/images/logo.png
    features:
        - navigation.tabs
        - navigation.indexes
        - content.annotations
    palette:
      primary: teal
    icon:
      annotation: material/chevron-right-circle

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - abbr
  - attr_list
  - pymdownx.snippets:
        auto_append:
            - includes/abbreviations.md
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - md_in_html
      
  
extra:
  generator: false

extra_css:
  - stylesheets/extra.css

  
  
plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: false
  - glightbox
