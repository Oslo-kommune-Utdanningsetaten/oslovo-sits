<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script>
function testStorage() {

    var flag = null;
    var timestamp = null;

    try {
        flag = localStorage.getItem("footerFlag");
        timestamp = localStorage.getItem("footerTimestamp");
    } catch (e) {
        document.getElementById("result").innerHTML =
            "ERROR: localStorage unavailable";
        return;
    }

    document.getElementById("storage").innerHTML =
        "footerFlag = " + flag + "<br>" +
        "footerTimestamp = " + timestamp;

    if (flag === "SPECIAL") {
        document.getElementById("result").innerHTML =
            "SUCCESS: localStorage shared";
    } else {
        document.getElementById("result").innerHTML =
            "FAILED: value not found";
    }
}
</script>

</head>

<body onload="testStorage()" style="font-size:10px">

<div id="result">Testing...</div>
<div id="storage"></div>

</body>
</html>
